<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Поръчка | SeaDesign</title>

<link rel="stylesheet" href="styles.css">

<style>

.checkout{

max-width:900px;

margin:60px auto;

background:white;

padding:40px;

border-radius:20px;

box-shadow:0 10px 30px rgba(0,0,0,.08);

}

.checkout h1{

margin-bottom:30px;

color:#0097b2;

}

form{

display:grid;

gap:20px;

}

input,textarea{

padding:15px;

border:1px solid #ddd;

border-radius:10px;

font-size:16px;

}

button{

padding:15px;

background:#0097b2;

color:white;

border:none;

border-radius:10px;

font-size:18px;

cursor:pointer;

}

button:hover{

background:#007a92;

}

</style>

</head>

<body>

<div class="checkout">

<h1>Завършване на поръчката</h1>

<form>

<input placeholder="Име и фамилия">

<input placeholder="Телефон">

<input placeholder="Имейл">

<input placeholder="Адрес">

<textarea rows="6" placeholder="Допълнителна информация"></textarea>

<button>

Изпрати поръчката

</button>

</form>

</div>

</body>

</html>
